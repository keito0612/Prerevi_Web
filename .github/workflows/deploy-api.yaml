name: Deploy API to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'docker/php/**'
      - 'cloudbuild-api.yaml'
      - '.github/workflows/deploy-api.yaml'

  workflow_dispatch:
    inputs:
      update_env:
        description: 'Update .env secret in Secret Manager'
        required: false
        default: false
        type: boolean

env:
  PROJECT_ID: prerebi-production
  REGION: asia-northeast1
  SERVICE_NAME: prerebi-api
  IMAGE_NAME: gcr.io/prerebi-production/prerebi-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker --quiet

      - name: Update .env secret (if requested)
        if: github.event.inputs.update_env == 'true'
        run: |
          echo "${{ secrets.ENV_PRODUCTION }}" | gcloud secrets versions add prerebi_env --data-file=-

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.IMAGE_NAME }}:latest \
            -f docker/php/Dockerfile.prod \
            .

      - name: Push Docker image
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.IMAGE_NAME }}:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 2 \
            --port 8080 \
            --set-env-vars "APP_ENV=production,APP_DEBUG=false,LOG_CHANNEL=stderr,DB_CONNECTION=libsql,FILESYSTEM_DISK=r2,MAIL_MAILER=resend,TRUSTED_PROXIES=*" \
            --set-secrets "/secrets/.env=prerebi_env:latest"

      - name: Show deployment URL
        run: |
          echo "Deployed to: $(gcloud run services describe ${{ env.SERVICE_NAME }} --region ${{ env.REGION }} --format 'value(status.url)')"
